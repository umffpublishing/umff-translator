<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UMFF 번역기</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue: #1b3a5c;
      --blue-light: #2a5080;
      --green: #2a7d5f;
      --green-light: #38a87e;
      --teal: #1a6676;
      --teal-light: #237a8e;
      --bg: #f2f4f6;
      --surface: #ffffff;
      --border: #dde2e8;
      --text: #1a1a1a;
      --muted: #6b7280;
      --error: #c0392b;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }

    /* ─── Header ─── */
    header {
      background: var(--teal);
      color: #fff;
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 2px 8px rgba(0,0,0,.25);
    }
    .header-title { font-size: 1.05rem; font-weight: 700; letter-spacing: -.02em; }
    .header-sub   { font-size: .75rem; opacity: .65; margin-top: 2px; }
    .btn-key {
      background: rgba(255,255,255,.15);
      border: 1px solid rgba(255,255,255,.3);
      color: #fff;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: .82rem;
      transition: background .15s;
    }
    .btn-key:hover { background: rgba(255,255,255,.25); }

    /* ─── API Key Bar ─── */
    .key-bar {
      background: #e8eef4;
      border-bottom: 1px solid var(--border);
      padding: 10px 32px;
      display: none;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .key-bar.open { display: flex; }
    .key-bar label { font-size: .8rem; color: #444; white-space: nowrap; }
    .key-bar input {
      flex: 1; min-width: 200px; max-width: 380px;
      padding: 7px 11px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-family: monospace; font-size: .82rem;
    }
    .btn-save {
      background: var(--teal); color: #fff;
      border: none; padding: 7px 16px;
      border-radius: 6px; cursor: pointer; font-size: .82rem;
    }
    .btn-save:hover { background: var(--teal-light); }
    #key-status { font-size: .78rem; color: var(--muted); }

    /* ─── Main ─── */
    .main { max-width: 1000px; margin: 0 auto; padding: 28px 24px; }

    .card {
      background: var(--surface);
      border-radius: 12px;
      padding: 22px 24px;
      box-shadow: 0 1px 4px rgba(0,0,0,.07);
      margin-bottom: 20px;
    }

    .card-label {
      font-size: .75rem; font-weight: 700;
      color: var(--muted); text-transform: uppercase;
      letter-spacing: .06em; margin-bottom: 10px;
    }

    /* ─── Selector rows (direction / type) ─── */
    .selector-row {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 14px; flex-wrap: wrap;
    }
    .selector-label {
      font-size: .78rem; color: var(--muted);
      white-space: nowrap; min-width: 68px;
    }
    .sel-btn {
      padding: 6px 18px;
      border: 1.5px solid var(--border); border-radius: 20px;
      background: #fff; color: var(--muted);
      font-size: .83rem; cursor: pointer; transition: all .15s;
    }
    .sel-btn:hover { border-color: #aaa; color: var(--text); }
    .sel-dir.active  { border-color: var(--teal); color: var(--teal); background: #eef7f9; font-weight: 700; }
    .sel-type.active { border-color: var(--blue); color: var(--blue); background: #eef3f9; font-weight: 700; }

    .divider { width: 1px; height: 22px; background: var(--border); margin: 0 4px; }

    textarea {
      width: 100%; min-height: 180px;
      padding: 14px 16px;
      border: 1px solid var(--border); border-radius: 8px;
      font-size: .93rem; line-height: 1.75;
      resize: vertical; font-family: inherit; color: var(--text);
      transition: border-color .15s;
    }
    textarea:focus { outline: none; border-color: var(--teal); }

    .option-row {
      margin-top: 10px;
    }
    .check-label {
      font-size: .8rem; color: var(--muted);
      display: flex; align-items: center; gap: 6px;
      cursor: pointer;
    }
    .check-label input[type="checkbox"] { cursor: pointer; }
    .check-hint { font-size: .74rem; color: #aaa; }

    .input-footer {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 14px;
    }
    .char-count { font-size: .78rem; color: var(--muted); }

    .btn-run {
      background: var(--teal); color: #fff;
      border: none; padding: 11px 30px;
      border-radius: 8px; font-size: .95rem; font-weight: 700;
      cursor: pointer; transition: background .15s;
      letter-spacing: -.01em;
    }
    .btn-run:hover:not(:disabled) { background: var(--teal-light); }
    .btn-run:disabled { background: #b0b8c1; cursor: not-allowed; }

    /* ─── Loading ─── */
    .loading {
      display: none; text-align: center;
      padding: 48px 24px; color: var(--muted);
    }
    .loading.show { display: block; }
    .spinner {
      display: inline-block;
      width: 36px; height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--teal);
      border-radius: 50%;
      animation: spin .75s linear infinite;
      margin-bottom: 14px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-msg { font-size: .9rem; }
    .loading-sub { font-size: .78rem; color: #aaa; margin-top: 6px; }

    /* ─── Error ─── */
    .error-box {
      background: #fff0f0; border: 1px solid #f5c6c6;
      border-radius: 8px; padding: 14px 18px;
      color: var(--error); font-size: .88rem;
      margin-bottom: 20px; display: none;
    }
    .error-box.show { display: block; }

    /* ─── Stream preview ─── */
    .stream-box {
      display: none;
      background: #f5faf8; border: 1px solid #b5ddd0;
      border-radius: 8px; padding: 16px 18px;
      font-size: .85rem; line-height: 1.7;
      white-space: pre-wrap; max-height: 280px;
      overflow-y: auto; color: #2a3a30;
      margin-bottom: 20px;
    }
    .stream-box.show { display: block; }

    /* ─── Results ─── */
    .results { display: none; }
    .results.show { display: block; }

    .tabs {
      display: flex; gap: 0;
      border-bottom: 2px solid var(--border);
      margin-bottom: 16px; flex-wrap: wrap;
    }
    .tab {
      padding: 9px 18px;
      cursor: pointer; font-size: .87rem; font-weight: 500;
      color: var(--muted);
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      transition: color .15s;
      white-space: nowrap;
    }
    .tab.active { color: var(--teal); border-bottom-color: var(--teal); font-weight: 700; }
    .tab:hover:not(.active) { color: var(--text); }
    .badge {
      display: inline-block;
      background: var(--teal); color: #fff;
      border-radius: 10px; padding: 0 7px;
      font-size: .72rem; font-weight: 700;
      margin-left: 5px; vertical-align: middle;
    }

    .panel { display: none; }
    .panel.active { display: block; }

    .panel-content {
      background: var(--surface);
      border-radius: 12px;
      padding: 22px 24px;
      box-shadow: 0 1px 4px rgba(0,0,0,.07);
    }

    .result-text {
      font-size: .93rem; line-height: 1.9;
      white-space: pre-wrap; color: var(--text);
    }

    /* translation output gets slightly larger text */
    #content0 { font-size: .96rem; line-height: 2.0; }

    .empty-msg {
      font-size: .88rem; color: var(--muted);
      text-align: center; padding: 32px;
    }

    .panel-footer {
      margin-top: 14px; display: flex; justify-content: flex-end; gap: 8px;
    }
    .btn-copy {
      background: none; border: 1px solid var(--border);
      color: var(--muted); padding: 6px 14px;
      border-radius: 6px; cursor: pointer; font-size: .8rem;
      transition: all .15s;
    }
    .btn-copy:hover { background: var(--bg); color: var(--text); }
    .btn-copy.copied { color: var(--teal); border-color: var(--teal); }

    /* ─── Token counter ─── */
    .token-bar {
      display: none;
      background: #f0faf7; border: 1px solid #a8dccb;
      border-radius: 8px; padding: 10px 16px;
      margin-bottom: 20px;
      font-size: .8rem; color: #1a5040;
      gap: 20px; flex-wrap: wrap; align-items: center;
    }
    .token-bar.show { display: flex; }
    .token-item { display: flex; flex-direction: column; gap: 2px; }
    .token-label { font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
    .token-value { font-weight: 700; font-size: .9rem; }
    .token-cost  { margin-left: auto; font-size: .85rem; color: var(--teal); font-weight: 700; }

    /* ─── Model selector ─── */
    .model-row {
      display: flex; align-items: center; gap: 10px;
      margin-top: 14px; flex-wrap: wrap;
    }
    .model-row label { font-size: .8rem; color: var(--muted); white-space: nowrap; }
    .model-btn {
      padding: 6px 16px;
      border: 1.5px solid var(--border); border-radius: 20px;
      background: #fff; color: var(--muted);
      font-size: .82rem; cursor: pointer; transition: all .15s;
    }
    .model-btn:hover { border-color: #aaa; color: var(--text); }
    .model-btn.active-sonnet { border-color: var(--teal); color: var(--teal); background: #eef7f9; font-weight: 700; }

    /* ─── Glossary notice ─── */
    .glossary-notice {
      font-size: .75rem; color: var(--muted);
      background: #f8f9fa; border: 1px solid var(--border);
      border-radius: 6px; padding: 8px 14px;
      margin-bottom: 20px;
    }
    .glossary-notice.warn { color: #8a6d00; background: #fffbe6; border-color: #ffe58f; }
    .glossary-notice.ok   { color: #1a5040; background: #f0faf7; border-color: #a8dccb; }

    /* ─── Length badge (in 길이 tab) ─── */
    .len-ok   { color: #2a7d5f; font-weight: 700; }
    .len-over { color: #c0392b; font-weight: 700; }
  </style>
</head>
<body>

<header>
  <div>
    <div class="header-title">울산울주세계산악영화제 · 번역기</div>
    <div class="header-sub">Ulsan Ulju Mountain Film Festival · Translation Tool</div>
  </div>
  <button class="btn-key" onclick="toggleKeyBar()">⚙ API Key</button>
</header>

<div class="key-bar" id="keyBar">
  <label>Anthropic API Key</label>
  <input type="password" id="keyInput" placeholder="sk-ant-..." />
  <button class="btn-save" onclick="saveKey()">저장</button>
  <span id="key-status"></span>
</div>

<div class="main">

  <div id="glossaryNotice" class="glossary-notice">글로서리 로드 중...</div>

  <div class="card">

    <!-- Direction selector -->
    <div class="selector-row">
      <span class="selector-label">번역 방향</span>
      <button class="sel-btn sel-dir active" id="btnKoEn" onclick="selectDirection('ko-en')">한 → 영</button>
      <button class="sel-btn sel-dir"         id="btnEnKo" onclick="selectDirection('en-ko')">영 → 한</button>
    </div>

    <!-- Content type selector -->
    <div class="selector-row">
      <span class="selector-label">콘텐츠 유형</span>
      <button class="sel-btn sel-type active" id="btnSynopsis" onclick="selectType('synopsis')">시놉시스</button>
      <button class="sel-btn sel-type"        id="btnNote"     onclick="selectType('note')">프로그램 노트</button>
      <button class="sel-btn sel-type"        id="btnBio"      onclick="selectType('bio')">바이오</button>
      <button class="sel-btn sel-type"        id="btnSection"    onclick="selectType('section')">섹션 서문</button>
      <button class="sel-btn sel-type"        id="btnExhibition" onclick="selectType('exhibition')">도서·전시 패널</button>
      <button class="sel-btn sel-type"        id="btnFestival"   onclick="selectType('festival')">페스티벌 이벤트</button>
    </div>

    <div class="card-label">원문</div>
    <textarea id="inputText"
      placeholder="번역할 원문을 여기에 붙여 넣으세요..."
      oninput="onInput()"></textarea>

    <div class="option-row">
      <label class="check-label">
        <input type="checkbox" id="chkFestivals">
        해외영화제·학교 명칭 포함
        <span class="check-hint">(원문에 해외 영화제·학교명이 나올 때만 체크)</span>
      </label>
    </div>

    <div class="model-row">
      <label>모델</label>
      <button class="model-btn active-sonnet" id="btnSonnet" onclick="selectModel('sonnet')">Sonnet 4.6</button>
    </div>

    <div class="input-footer">
      <span class="char-count" id="charCount">0자</span>
      <button class="btn-run" id="runBtn" onclick="runTranslation()">번역 시작</button>
    </div>
  </div>

  <div class="token-bar" id="tokenBar">
    <div class="token-item">
      <span class="token-label">입력 토큰</span>
      <span class="token-value" id="tokIn">—</span>
    </div>
    <div class="token-item">
      <span class="token-label">캐시 쓰기</span>
      <span class="token-value" id="tokCacheWrite">—</span>
    </div>
    <div class="token-item">
      <span class="token-label">캐시 읽기</span>
      <span class="token-value" id="tokCacheRead">—</span>
    </div>
    <div class="token-item">
      <span class="token-label">출력 토큰</span>
      <span class="token-value" id="tokOut">—</span>
    </div>
    <div class="token-cost" id="tokCost">—</div>
  </div>

  <div class="error-box" id="errorBox"></div>

  <div class="loading" id="loading">
    <div class="spinner"></div>
    <div class="loading-msg">번역 진행 중입니다…</div>
    <div class="loading-sub">글로서리와 스타일 가이드를 참조하는 중입니다</div>
  </div>

  <div class="stream-box" id="streamBox"></div>

  <div class="results" id="results">
    <div class="tabs" id="tabs">
      <div class="tab active" onclick="switchTab(0)">번역문</div>
      <div class="tab"        onclick="switchTab(1)">길이</div>
    </div>

    <div class="panel active" id="panel0">
      <div class="panel-content">
        <div class="result-text" id="content0"></div>
        <div class="panel-footer">
          <button class="btn-copy" id="copyBtn0" onclick="copyContent(0)">번역문 복사</button>
        </div>
      </div>
    </div>
    <div class="panel" id="panel1">
      <div class="panel-content">
        <div class="result-text" id="content1"></div>
      </div>
    </div>
  </div>

</div><!-- .main -->

## 2. 한→영

### 한→영 공통 원칙

**원문 충실도 우선**
원문에 없는 이미지·수식어·극적 어휘 추가 금지. 원문이 담백하면 번역도 담백하게.
✗ 경계→"razor's edge" / ✗ 잊힌→"erased" / ✗ 폴란드인들의 대자유→"a great freedom uniquely their own"
✓ boundary/edge / forgotten / their great freedom

**어휘 등급(register)**
프로그램북에 맞는 자연스럽고 명확한 어휘 선택. 라틴어 차용어·격식 과잉 표현 지양.
✗ 역저→magnum opus → ✓ monumental work
✗ 기록자→chronicler (편년사가 뉘앙스) → ✓ record-keeper
✗ 끈질긴→tireless (지칠 줄 모르는) → ✓ persistent/relentless
✗ 사료→historical records (너무 포괄적) → ✓ archival sources/archival research

**숫자 표기**
본문 내 숫자는 문자로 풀어 쓴다. 연도·정밀 수치는 예외.
✗ 60여 년→"60 years" / ✓ "more than sixty years"
✗ 2백만→"2 million" / ✓ "two million"
예외: 1947년→1947 / 8,000m / 50+ awards

      if (!r.ok) throw new Error(r.status);
      return { label, text: await r.text() };
    } catch {
      failed.push(label);
      return null;
    }
  }

  const results = await Promise.all([
    tryFetch('./glossary/proper-nouns.csv',      'proper-nouns.csv'),
    tryFetch('./glossary/festivals-schools.csv',  'festivals-schools.csv'),
    tryFetch('./glossary/notation-rules.md',      'notation-rules.md'),
    tryFetch('./glossary/style_guide_v2.md',      'style_guide_v2.md'),
    tryFetch('./glossary/tm-examples.md',         'tm-examples.md'),
  ]);

  if (results[0]) { properNouns   = results[0].text; loaded.push(results[0].label); }
  if (results[1]) { festivalsData = results[1].text; loaded.push(results[1].label); }
  if (results[2]) { notationRules = results[2].text; loaded.push(results[2].label); }
  if (results[3]) { styleGuide    = results[3].text; loaded.push(results[3].label); }
  if (results[4]) { tmExamples    = results[4].text; loaded.push(results[4].label); }


  if (failed.length === 0) {
    notice.className = 'glossary-notice ok';
    notice.textContent = `✓ 글로서리 로드 완료 (${loaded.join(' · ')})`;
  } else if (loaded.length > 0) {
    notice.className = 'glossary-notice warn';
    notice.textContent = `⚠ 일부 파일 로드 실패 (${failed.join(', ')}) — 내장 데이터로 대체. 나머지 파일은 최신 버전 사용.`;
  } else {
    notice.className = 'glossary-notice warn';
    notice.textContent = '⚠ 글로서리 파일을 로드하지 못했습니다. 내장된 데이터로 실행합니다. (서버 환경에서 실행하면 최신 파일을 불러옵니다)';
  }
}

// 정적 블록: 글로서리·가이드·예시·출력형식 — cache_control 적용 대상
// D-1: proper-nouns CSV → 카테고리별 JSON 최소화
function csvToCompactJson(csvText) {
  const SKIP_CATS = new Set(['전화번호', '주소', '가격']);
  const lines = csvText.trim().split('\n').slice(1);
  const result = {};
  for (const line of lines) {
    const parts = line.split(',');
    const [category, ko, en] = parts;
    if (!category || !ko || !en) continue;
    const cat = category.trim(), k = ko.trim(), e = en.trim();
    if (SKIP_CATS.has(cat)) continue;
    if (!result[cat]) result[cat] = {};
    result[cat][k] = e;
  }
  return JSON.stringify(result, null, 0);
}

// B-1: 선택된 유형×방향에 맞는 tm-examples 섹션만 추출
function getFilteredExamples() {
  const sectionMap = {
    'synopsis-en-ko': '## 시놉시스 · 영 → 한',
    'synopsis-ko-en': '## 시놉시스 · 한 → 영',
    'note-en-ko':     '## 프로그램 노트 · 영 → 한',
    'note-ko-en':     '## 프로그램 노트 · 한 → 영',
    'bio-en-ko':      '## 바이오 · 영 → 한',
    'bio-ko-en':      '## 바이오 · 한 → 영',
    'section-ko-en':  '## 섹션 서문 · 한 → 영',
    'festival-ko-en': '## 페스티벌 프로그램 · 한 → 영',
  };
  const key = `${selectedType}-${selectedDirection}`;
  const header = sectionMap[key];
  if (!header) return '';
  const start = tmExamples.indexOf(header);
  if (start === -1) return '';
  const nextSection = tmExamples.indexOf('\n## ', start + header.length);
  const end = nextSection === -1 ? tmExamples.length : nextSection;
  return tmExamples.slice(start, end).trim();
}

// ═══════════════════════════════════════════════
//  Response parser
// ═══════════════════════════════════════════════
function parseResponse(raw) {
  // 마크다운 기호(**[SECTION:...]**) 제거
  const normalized = raw.replace(/\*+(\[(?:\/?)\s*SECTION[^\]]*\])\*+/gi, '$1');

  const get = (key) => {
    // 1차: 공백·대소문자 허용한 정규식
    const re = new RegExp(`\\[SECTION\\s*:\\s*${key}\\s*\\]([\\s\\S]*?)\\[\\s*/SECTION\\s*\\]`, 'i');
    const m = normalized.match(re);
    if (m) return m[1].trim();

    // 2차: [/SECTION] 없이 잘린 경우 — 다음 [SECTION: 또는 끝까지 캡처
    const re2 = new RegExp(`\\[SECTION\\s*:\\s*${key}\\s*\\]([\\s\\S]*?)(?=\\[SECTION\\s*:|$)`, 'i');
    const m2 = normalized.match(re2);
    return m2 ? m2[1].trim() : '';
  };

  return {
    translation : get('번역문'),
    length      : get('길이'),
  };
}

function renderMarkdown(text) {
  return text
    .replace(/\n{2,}/g, '\n')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>');
}

// ═══════════════════════════════════════════════
//  Main: run translation
// ═══════════════════════════════════════════════
async function runTranslation() {
  clearError();
  document.getElementById('tokenBar').classList.remove('show');

  const text = document.getElementById('inputText').value.trim();
  if (!text) { showError('번역할 텍스트를 입력하세요.'); return; }

  const apiKey = localStorage.getItem('umff_api_key');
  if (!apiKey) {
    showError('API Key가 설정되지 않았습니다. 우측 상단 ⚙ API Key 버튼을 눌러 입력하세요.');
    toggleKeyBar();
    return;
  }

  // 결과 영역을 미리 열고 번역문 탭으로 전환 — 스트림 중에도 내용이 실시간으로 표시됨
  document.getElementById('content0').textContent = '';
  document.getElementById('content1').textContent = '';
  document.getElementById('results').classList.add('show');
  switchTab(0);

  const dirLabel  = selectedDirection === 'ko-en' ? '한→영' : '영→한';
  const typeLabel = TYPE_LABELS[selectedType];
  const userMsg   = `다음 텍스트를 번역해 주세요.\n번역 방향: ${dirLabel} / 유형: ${typeLabel}\n\n${text}`;

  setLoading(true);

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-beta': 'prompt-caching-2024-07-31',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: MODEL_CONFIG[selectedModel].id,
        max_tokens: 8000,
        stream: true,
        system: [
          { type: 'text', text: buildStaticPrompt(),  cache_control: { type: 'ephemeral' } },
          { type: 'text', text: buildDynamicPrompt() }
        ],
        messages: [{ role: 'user', content: userMsg }]
      })
    });

    if (!response.ok) {
      let msg = `HTTP ${response.status}`;
      try { const e = await response.json(); msg = e.error?.message || msg; } catch {}
      throw new Error(msg);
    }

    const reader  = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let fullText = '';
    let inputUsage = null;
    let usageData  = null;

    document.getElementById('loading').querySelector('.loading-msg').textContent = '번역 진행 중… (실시간 출력)';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const data = line.slice(6).trim();
        if (data === '[DONE]') continue;
        try {
          const evt = JSON.parse(data);
          if (evt.type === 'message_start' && evt.message?.usage) {
            inputUsage = evt.message.usage;
          }
          if (evt.type === 'content_block_delta' && evt.delta?.type === 'text_delta') {
            fullText += evt.delta.text;
            // [SECTION:번역문] 이후 텍스트만 실시간으로 탭에 표시
            const m = fullText.match(/\[SECTION\s*:\s*번역문\s*\]([\s\S]*)/i);
            if (m) {
              document.getElementById('content0').innerHTML =
                renderMarkdown(m[1].replace(/\[\/SECTION\][\s\S]*/i, '').trim() || '…');
            }
          }
          if (evt.type === 'message_delta' && evt.usage) {
            usageData = evt.usage;
          }
        } catch {}
      }
    }

    setLoading(false);

    // Token counter
    if (usageData || inputUsage) {
      const inTok      = inputUsage?.input_tokens                || 0;
      const cacheWrite = inputUsage?.cache_creation_input_tokens || 0;
      const cacheRead  = inputUsage?.cache_read_input_tokens     || 0;
      const outTok     = usageData?.output_tokens                || 0;
      const p = MODEL_CONFIG[selectedModel];
      const costUSD = (inTok * p.input + cacheWrite * p.cacheWrite + cacheRead * p.cacheRead + outTok * p.output) / 1_000_000;
      const costKRW = Math.round(costUSD * 1550);
      const cacheHit = cacheRead > 0;
      document.getElementById('tokIn').textContent         = inTok.toLocaleString();
      document.getElementById('tokCacheWrite').textContent = cacheWrite > 0 ? cacheWrite.toLocaleString() : '—';
      document.getElementById('tokCacheRead').textContent  = cacheRead  > 0 ? `${cacheRead.toLocaleString()} ✓` : '—';
      document.getElementById('tokOut').textContent        = outTok.toLocaleString();
      document.getElementById('tokCost').textContent       = `${p.label} · 약 $${costUSD.toFixed(4)} (₩${costKRW})${cacheHit ? ' 🔁캐시' : ''}`;
      document.getElementById('tokenBar').classList.add('show');
    }

    const parsed = parseResponse(fullText);

    if (!parsed.translation && fullText) {
      showError('출력 형식 오류 — 번역문 탭에 전체 응답을 표시합니다. 수동으로 복사하세요.');
      document.getElementById('content0').textContent = fullText;
    } else {
      document.getElementById('content0').innerHTML = renderMarkdown(parsed.translation || '(번역문 없음)');
    }
    document.getElementById('content1').textContent = parsed.length || '(내용 없음)';

  } catch (err) {
    setLoading(false);
    document.getElementById('results').classList.remove('show');
    showError(err.message);
  }
}

function copyContent(panelIdx) {
  const text = document.getElementById(`content${panelIdx}`).textContent;
  const btnId = `copyBtn${panelIdx}`;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById(btnId);
    btn.textContent = '복사됨!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '번역문 복사'; btn.classList.remove('copied'); }, 2000);
  }).catch(() => {
    const btn = document.getElementById(btnId);
    btn.textContent = '복사 실패';
    setTimeout(() => { btn.textContent = '번역문 복사'; }, 2000);
  });
}
