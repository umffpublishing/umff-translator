<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UMFF 번역기</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue: #1b3a5c;
      --blue-light: #2a5080;
      --green: #2a7d5f;
      --green-light: #38a87e;
      --teal: #1a6676;
      --teal-light: #237a8e;
      --bg: #f2f4f6;
      --surface: #ffffff;
      --border: #dde2e8;
      --text: #1a1a1a;
      --muted: #6b7280;
      --error: #c0392b;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }

    /* ─── Header ─── */
    header {
      background: var(--teal);
      color: #fff;
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 2px 8px rgba(0,0,0,.25);
    }
    .header-title { font-size: 1.05rem; font-weight: 700; letter-spacing: -.02em; }
    .header-sub   { font-size: .75rem; opacity: .65; margin-top: 2px; }
    .btn-key {
      background: rgba(255,255,255,.15);
      border: 1px solid rgba(255,255,255,.3);
      color: #fff;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: .82rem;
      transition: background .15s;
    }
    .btn-key:hover { background: rgba(255,255,255,.25); }

    /* ─── API Key Bar ─── */
    .key-bar {
      background: #e8eef4;
      border-bottom: 1px solid var(--border);
      padding: 10px 32px;
      display: none;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .key-bar.open { display: flex; }
    .key-bar label { font-size: .8rem; color: #444; white-space: nowrap; }
    .key-bar input {
      flex: 1; min-width: 200px; max-width: 380px;
      padding: 7px 11px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-family: monospace; font-size: .82rem;
    }
    .btn-save {
      background: var(--teal); color: #fff;
      border: none; padding: 7px 16px;
      border-radius: 6px; cursor: pointer; font-size: .82rem;
    }
    .btn-save:hover { background: var(--teal-light); }
    #key-status { font-size: .78rem; color: var(--muted); }

    /* ─── Main ─── */
    .main { max-width: 1000px; margin: 0 auto; padding: 28px 24px; }

    .card {
      background: var(--surface);
      border-radius: 12px;
      padding: 22px 24px;
      box-shadow: 0 1px 4px rgba(0,0,0,.07);
      margin-bottom: 20px;
    }

    .card-label {
      font-size: .75rem; font-weight: 700;
      color: var(--muted); text-transform: uppercase;
      letter-spacing: .06em; margin-bottom: 10px;
    }

    /* ─── Selector rows (direction / type) ─── */
    .selector-row {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 14px; flex-wrap: wrap;
    }
    .selector-label {
      font-size: .78rem; color: var(--muted);
      white-space: nowrap; min-width: 68px;
    }
    .sel-btn {
      padding: 6px 18px;
      border: 1.5px solid var(--border); border-radius: 20px;
      background: #fff; color: var(--muted);
      font-size: .83rem; cursor: pointer; transition: all .15s;
    }
    .sel-btn:hover { border-color: #aaa; color: var(--text); }
    .sel-dir.active  { border-color: var(--teal); color: var(--teal); background: #eef7f9; font-weight: 700; }
    .sel-type.active { border-color: var(--blue); color: var(--blue); background: #eef3f9; font-weight: 700; }

    .divider { width: 1px; height: 22px; background: var(--border); margin: 0 4px; }

    textarea {
      width: 100%; min-height: 180px;
      padding: 14px 16px;
      border: 1px solid var(--border); border-radius: 8px;
      font-size: .93rem; line-height: 1.75;
      resize: vertical; font-family: inherit; color: var(--text);
      transition: border-color .15s;
    }
    textarea:focus { outline: none; border-color: var(--teal); }

    .option-row {
      margin-top: 10px;
    }
    .check-label {
      font-size: .8rem; color: var(--muted);
      display: flex; align-items: center; gap: 6px;
      cursor: pointer;
    }
    .check-label input[type="checkbox"] { cursor: pointer; }
    .check-hint { font-size: .74rem; color: #aaa; }

    .input-footer {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 14px;
    }
    .char-count { font-size: .78rem; color: var(--muted); }

    .btn-run {
      background: var(--teal); color: #fff;
      border: none; padding: 11px 30px;
      border-radius: 8px; font-size: .95rem; font-weight: 700;
      cursor: pointer; transition: background .15s;
      letter-spacing: -.01em;
    }
    .btn-run:hover:not(:disabled) { background: var(--teal-light); }
    .btn-run:disabled { background: #b0b8c1; cursor: not-allowed; }

    /* ─── Loading ─── */
    .loading {
      display: none; text-align: center;
      padding: 48px 24px; color: var(--muted);
    }
    .loading.show { display: block; }
    .spinner {
      display: inline-block;
      width: 36px; height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--teal);
      border-radius: 50%;
      animation: spin .75s linear infinite;
      margin-bottom: 14px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-msg { font-size: .9rem; }
    .loading-sub { font-size: .78rem; color: #aaa; margin-top: 6px; }

    /* ─── Error ─── */
    .error-box {
      background: #fff0f0; border: 1px solid #f5c6c6;
      border-radius: 8px; padding: 14px 18px;
      color: var(--error); font-size: .88rem;
      margin-bottom: 20px; display: none;
    }
    .error-box.show { display: block; }

    /* ─── Stream preview ─── */
    .stream-box {
      display: none;
      background: #f5faf8; border: 1px solid #b5ddd0;
      border-radius: 8px; padding: 16px 18px;
      font-size: .85rem; line-height: 1.7;
      white-space: pre-wrap; max-height: 280px;
      overflow-y: auto; color: #2a3a30;
      margin-bottom: 20px;
    }
    .stream-box.show { display: block; }

    /* ─── Results ─── */
    .results { display: none; }
    .results.show { display: block; }

    .tabs {
      display: flex; gap: 0;
      border-bottom: 2px solid var(--border);
      margin-bottom: 16px; flex-wrap: wrap;
    }
    .tab {
      padding: 9px 18px;
      cursor: pointer; font-size: .87rem; font-weight: 500;
      color: var(--muted);
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      transition: color .15s;
      white-space: nowrap;
    }
    .tab.active { color: var(--teal); border-bottom-color: var(--teal); font-weight: 700; }
    .tab:hover:not(.active) { color: var(--text); }
    .badge {
      display: inline-block;
      background: var(--teal); color: #fff;
      border-radius: 10px; padding: 0 7px;
      font-size: .72rem; font-weight: 700;
      margin-left: 5px; vertical-align: middle;
    }

    .panel { display: none; }
    .panel.active { display: block; }

    .panel-content {
      background: var(--surface);
      border-radius: 12px;
      padding: 22px 24px;
      box-shadow: 0 1px 4px rgba(0,0,0,.07);
    }

    .result-text {
      font-size: .93rem; line-height: 1.9;
      white-space: pre-wrap; color: var(--text);
    }

    /* translation output gets slightly larger text */
    #content0 { font-size: .96rem; line-height: 2.0; }

    .empty-msg {
      font-size: .88rem; color: var(--muted);
      text-align: center; padding: 32px;
    }

    .panel-footer {
      margin-top: 14px; display: flex; justify-content: flex-end; gap: 8px;
    }
    .btn-copy {
      background: none; border: 1px solid var(--border);
      color: var(--muted); padding: 6px 14px;
      border-radius: 6px; cursor: pointer; font-size: .8rem;
      transition: all .15s;
    }
    .btn-copy:hover { background: var(--bg); color: var(--text); }
    .btn-copy.copied { color: var(--teal); border-color: var(--teal); }

    /* ─── Token counter ─── */
    .token-bar {
      display: none;
      background: #f0faf7; border: 1px solid #a8dccb;
      border-radius: 8px; padding: 10px 16px;
      margin-bottom: 20px;
      font-size: .8rem; color: #1a5040;
      gap: 20px; flex-wrap: wrap; align-items: center;
    }
    .token-bar.show { display: flex; }
    .token-item { display: flex; flex-direction: column; gap: 2px; }
    .token-label { font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
    .token-value { font-weight: 700; font-size: .9rem; }
    .token-cost  { margin-left: auto; font-size: .85rem; color: var(--teal); font-weight: 700; }

    /* ─── Model selector ─── */
    .model-row {
      display: flex; align-items: center; gap: 10px;
      margin-top: 14px; flex-wrap: wrap;
    }
    .model-row label { font-size: .8rem; color: var(--muted); white-space: nowrap; }
    .model-btn {
      padding: 6px 16px;
      border: 1.5px solid var(--border); border-radius: 20px;
      background: #fff; color: var(--muted);
      font-size: .82rem; cursor: pointer; transition: all .15s;
    }
    .model-btn:hover { border-color: #aaa; color: var(--text); }
    .model-btn.active-sonnet { border-color: var(--teal); color: var(--teal); background: #eef7f9; font-weight: 700; }

    /* ─── Glossary notice ─── */
    .glossary-notice {
      font-size: .75rem; color: var(--muted);
      background: #f8f9fa; border: 1px solid var(--border);
      border-radius: 6px; padding: 8px 14px;
      margin-bottom: 20px;
    }
    .glossary-notice.warn { color: #8a6d00; background: #fffbe6; border-color: #ffe58f; }
    .glossary-notice.ok   { color: #1a5040; background: #f0faf7; border-color: #a8dccb; }

    /* ─── Length badge (in 길이 tab) ─── */
    .len-ok   { color: #2a7d5f; font-weight: 700; }
    .len-over { color: #c0392b; font-weight: 700; }
  </style>
</head>
<body>

<header>
  <div>
    <div class="header-title">울산울주세계산악영화제 · 번역기</div>
    <div class="header-sub">Ulsan Ulju Mountain Film Festival · Translation Tool</div>
  </div>
  <button class="btn-key" onclick="toggleKeyBar()">⚙ API Key</button>
</header>

<div class="key-bar" id="keyBar">
  <label>Anthropic API Key</label>
  <input type="password" id="keyInput" placeholder="sk-ant-..." />
  <button class="btn-save" onclick="saveKey()">저장</button>
  <span id="key-status"></span>
</div>

<div class="main">

  <div id="glossaryNotice" class="glossary-notice">글로서리 로드 중...</div>

  <div class="card">

    <!-- Direction selector -->
    <div class="selector-row">
      <span class="selector-label">번역 방향</span>
      <button class="sel-btn sel-dir active" id="btnKoEn" onclick="selectDirection('ko-en')">한 → 영</button>
      <button class="sel-btn sel-dir"         id="btnEnKo" onclick="selectDirection('en-ko')">영 → 한</button>
    </div>

    <!-- Content type selector -->
    <div class="selector-row">
      <span class="selector-label">콘텐츠 유형</span>
      <button class="sel-btn sel-type active" id="btnSynopsis" onclick="selectType('synopsis')">시놉시스</button>
      <button class="sel-btn sel-type"        id="btnNote"     onclick="selectType('note')">프로그램 노트</button>
      <button class="sel-btn sel-type"        id="btnBio"      onclick="selectType('bio')">바이오</button>
      <button class="sel-btn sel-type"        id="btnSection"    onclick="selectType('section')">섹션 서문</button>
      <button class="sel-btn sel-type"        id="btnExhibition" onclick="selectType('exhibition')">도서·전시 패널</button>
      <button class="sel-btn sel-type"        id="btnFestival"   onclick="selectType('festival')">페스티벌 이벤트</button>
    </div>

    <div class="card-label">원문</div>
    <textarea id="inputText"
      placeholder="번역할 원문을 여기에 붙여 넣으세요..."
      oninput="onInput()"></textarea>

    <div class="option-row">
      <label class="check-label">
        <input type="checkbox" id="chkFestivals">
        해외영화제·학교 명칭 포함
        <span class="check-hint">(원문에 해외 영화제·학교명이 나올 때만 체크)</span>
      </label>
    </div>

    <div class="model-row">
      <label>모델</label>
      <button class="model-btn active-sonnet" id="btnSonnet" onclick="selectModel('sonnet')">Sonnet 5</button>
    </div>

    <div class="input-footer">
      <span class="char-count" id="charCount">0자</span>
      <button class="btn-run" id="runBtn" onclick="runTranslation()">번역 시작</button>
    </div>
  </div>

  <div class="token-bar" id="tokenBar">
    <div class="token-item">
      <span class="token-label">입력 토큰</span>
      <span class="token-value" id="tokIn">—</span>
    </div>
    <div class="token-item">
      <span class="token-label">캐시 쓰기</span>
      <span class="token-value" id="tokCacheWrite">—</span>
    </div>
    <div class="token-item">
      <span class="token-label">캐시 읽기</span>
      <span class="token-value" id="tokCacheRead">—</span>
    </div>
    <div class="token-item">
      <span class="token-label">출력 토큰</span>
      <span class="token-value" id="tokOut">—</span>
    </div>
    <div class="token-cost" id="tokCost">—</div>
  </div>

  <div class="error-box" id="errorBox"></div>

  <div class="loading" id="loading">
    <div class="spinner"></div>
    <div class="loading-msg">번역 진행 중입니다…</div>
    <div class="loading-sub">글로서리와 스타일 가이드를 참조하는 중입니다</div>
  </div>

  <div class="stream-box" id="streamBox"></div>

  <div class="results" id="results">
    <div class="tabs" id="tabs">
      <div class="tab active" onclick="switchTab(0)">번역문</div>
      <div class="tab"        onclick="switchTab(1)">길이</div>
    </div>

    <div class="panel active" id="panel0">
      <div class="panel-content">
        <div class="result-text" id="content0"></div>
        <div class="panel-footer">
          <button class="btn-copy" id="copyBtn0" onclick="copyContent(0)">번역문 복사</button>
        </div>
      </div>
    </div>
    <div class="panel" id="panel1">
      <div class="panel-content">
        <div class="result-text" id="content1"></div>
      </div>
    </div>
  </div>

</div><!-- .main -->

              예) 깃발로 기록됨 → “triumphs of”              (triumphs 추가 금지)
              예) 강한 바람 → “biting wind”                  (biting 추가 금지 → strong wind)
\`\`\`

**규칙 0-2 수식어·절 완전 보존**
원문의 형용사·부사 수식어뿐 아니라 동기·이유·목적을 나타내는 구·절도 임의로 생략하지 않는다.
\`\`\`
✗ 잘못: painful struggle → “투쟁”                            (수식어 누락)
✓ 올바름: painful struggle → 고통스러운 투쟁

✗ 잘못: brutally cold → “추운”                               (부사 누락)
✓ 올바름: brutally cold → 살을 에는 듯 추운 / 혹독하게 차가운

✗ 잘못: “진짜 삶을 찾아 네팔에 거주하면서” → “relocated to Nepal”   (동기 절 누락)
✓ 올바름: “in search of a life truly lived, relocated to Nepal”
\`\`\`

**규칙 0-3 동어반복 해소 (영→한)**
영어에서 의미가 겹치는 수식어를 쌓을 때, 한국어에서는 하나로 합치거나 동사로 풀어 동어반복을 피한다.
\`\`\`
✗ 잘못: liberating freedom → “해방적인 자유”   (동어반복)
✓ 올바름: liberating freedom → 해방 / 진정한 자유
✗ 잘못: painful agony → “고통스러운 고통”
✓ 올바름: painful agony → 극심한 고통 / 고통 속에서
\`\`\`

**규칙 0-4 원문 내용 완전 보존 — 어떤 정보도 누락 금지**
원문의 모든 정보 단위를 빠짐없이 번역문에 반영한다. 두 가지 자주 빠지는 패턴:

**a) 작품 제목이 원문의 주어일 때** (\`X follows / X tells / X documents\` 등) 한국어 구조를 바꾸더라도 제목 포함.
\`\`\`
✓ <K2: 그림자를 따라서>는 … Benjamin Védrines가 … 여정을 따라간다.
✗ 알피니스트 벤자맹 베드린은 …  (제목 누락)

✓ 『Alpine Rising』은 한 세기 동안 … 이름들을 불러낸다.
✗ 한 세기 동안 … 이름들을 불러내는 책이다.  (제목 누락)
\`\`\`

**b) 시간·정도·초점 한정어** (\`yet / still / last / only / already / ever / often\` 등) 누락 금지.
\`\`\`
✗ his most ambitious challenge yet → “가장 야심 찬 도전”     (yet = 지금껏 누락)
✓                                 → 지금껏 가장 야심 찬 도전

✗ the last traditional gold miners → “전통식 금 채굴자들”    (last 누락)
✓                                 → 마지막 전통식 금 채굴자들

✗ the quiet unease that often drives people to extremes → “사람을 극단으로 몰아가는 조용한 불안”  (often 누락)
✓                                                      → 때로 사람을 극단으로 내모는 조용한 불안
\`\`\`

**c) 의도·목적 조동사** (\`aims to / seeks to / attempts to / hopes to\` 등) 기정사실로 바꾸지 않는다.
\`\`\`
✗ The film aims to showcase X → “X를 담아낸다”        (aims to = 의도 표현 누락, 기정사실로 왜곡)
✓                              → X를 담아내고자 한다 / X를 그리려 한다
\`\`\`

**규칙 0-5 번역체 회피 (영→한)**
직역 구조·수동태를 한국어 자연 문체로 바꾼다.

| 번역체 패턴 | 수정 방향 |
|---|---|
| \`~에 의해 드러났다 / ~에 의해 만들어졌다\` | 능동으로 재구성: \`~가 꺼내 보이다 / ~가 드러나다\` |
| \`raw → 순수한\` (의미 불일치 직역) | \`날것의 / 원초적인\` |
| \`reckoning → 성찰\` (강도 순화) | \`자기 직면 / 내면의 청산\` |
| 영어 단문 나열을 하나의 긴 복합문으로 묶기 | 원문 단문 구조 유지 또는 짧게 분리 |
| 영어 동격·관계절 이식 (\`her mother, an activist, passes away\`) | 앞에 관형절로 쌓지 않는다. 문장 분리 또는 주어 재구성 |
| \`~에 관한 / ~에 대한\` 전치사 직역 | \`~의 문제로\` / \`~를 둘러싼\` / 서술어로 풀기 |
| 영어 동사+목적어 관용구 직역 (\`brings X\`, \`faces X\`, \`inspire X to Y\`, \`call upon lessons\` 등) | 한국어 자동사·관용구로 재구성: \`찾아오다\`/\`맞닥뜨리다\`/\`넘어야 한다\`/\`뜻을 모으다\`/\`마음에 새기다\` 등 |
\`\`\`
✗ 잘못: 예상치 못한 정직함과 명료함으로 Benjamin 자신에 의해 드러났다.
✓ 올바름: Benjamin 스스로가 예상치 못한 솔직함과 명료함으로 꺼내 보이면서.

✗ 잘못: raw physical achievement → 순수한 신체적 성취
✓ 올바름: raw physical achievement → 날것의 신체 성취

✗ 잘못: 환경 운동가이자 사진기자였던 어머니가 세상을 떠난 후 새 동네로 이사한다.
        (← “after her mother, an activist, passes away” 동격절 이식)
✓ 올바름: 어머니를 잃은 알마는 아버지와 함께 새 동네로 이사한다.

✗ 잘못: 연대와 용서에 관한 갈등으로 번져간다
✓ 올바름: 연대와 용서의 문제로 번져간다

✗ 잘못: 그토록 오래 기다려온 자유를 가져다줄 것인가 / 더 많은 시련과 마주해야 한다
✓ 올바름: 그토록 기다려온 자유가 찾아올 것인가 / 더 많은 시련을 넘어야 한다

✗ 잘못: 마을 사람들에게 영감을 불어넣어 자체적인 스키 대회를 만들어낸다
✓ 올바름: 마을 사람들과 뜻을 모아 자체적인 스키 대회를 만든다

✗ 잘못: 그들은 그 교훈을 다시 한번 되새겨야 한다
✓ 올바름: 그들은 그 가르침을 다시 마음에 새겨야 한다
\`\`\`

**규칙 0-7 단락 구조 보존 — 빈 줄 추가 금지**
원문의 줄바꿈 횟수를 그대로 유지한다. 원문이 줄바꿈 한 번으로 단락을 구분하면 번역문도 줄바꿈 한 번만 사용한다. 원문에 없는 빈 줄(줄바꿈 두 번)을 단락 사이에 삽입하지 않는다.
\`\`\`
✗ 잘못: 원문 단락이 \\n 하나로 구분 → 번역문에 \\n\\n(빈 줄) 삽입
✓ 올바름: 원문 단락 구분 방식 그대로 유지
\`\`\`

**규칙 0-6 의역 허용 범위 — 페스티벌 이벤트 제외**
시놉시스·프로그램 노트·바이오·섹션 서문·도서 패널에서는 원문의 의미와 강도를 유지하는 범위 내에서 문학적 어휘 선택과 문장 단위 재구성을 허용한다.
페스티벌 이벤트(→ 섹션 2-5, 규칙 28~31)는 정보 전달이 목적이므로 직역 원칙을 유지한다.

허용:
- 원문 뉘앙스를 살리는 창의적 동사·어휘 선택
  \`\`\`
  ponder → 곱씹다   (더 생생한 표현)
  whose deaths weigh → 무겁게 쌓이는 죽음   (함축된 뉘앙스를 동사로 구현)
  precarious → 낡은   (맥락에 맞는 해석적 선택)
  \`\`\`
- 한국어 리듬을 위한 문장 단위 재구성·어순 변경
- 강조·호흡을 위한 파편 문장 사용
  \`\`\`
  “They are a group of shepherd siblings, aged eight to twenty.”
  → 여덟 살부터 스무 살까지, 목동 형제자매들의 무리다.
  \`\`\`

금지 (의역 허용 범위에서도 적용):
- 원문에 없는 이미지·개념 추가 (→ 규칙 0-1 유지)
- 정보 누락 (→ 규칙 0-4 유지)
- 강도 왜곡·극적 격상 (→ 규칙 0-1 유지)

## 1. 영→한

### 1-1. 시놉시스

**규칙 1** 관계절·분사구 → 앞당긴 관형절
\`\`\`
EN: Emin, in his twilight years, toils alongside his faithful horse.
KO: 황혼기에 접어든 에민은 충실한 말과 함께 묵묵히 삶을 이어간다.

EN: The director, herself a climber, sets off to the Himalayas in her footsteps.
KO: 등반가인 감독은 그녀의 발자취를 따라 히말라야로 향한다.
\`\`\`

**규칙 2** 영어 단문 나열 → \`~고\`, \`~며\`, \`~지만\`, \`~는데\`, \`~면서\`로 연결 (흐름이 자연스러울 때만, 2~3개까지만; 4개 이상을 한 문장으로 묶지 않는다)
\`\`\`
EN: Eventually, Hangma leaves Namsang... She elopes with another man... but eventually returns...
KO: 결국 항마는 남상을 떠나 부모님의 집으로 돌아가고, 다른 남자 로이딥 슈레스타를 만나 떠나지만,
    가족이 배상금을 지불하지 못하자 결국 남상에게 돌아오게 되는데...
\`\`\`
말줄임표: **아래 점 3개(\`...\`)만** 사용 (중간점 \`···\`·유니코드 \`…\` 불가).

**규칙 3** 영어 시제 무관하게 한국어 **현재형** 유지
\`\`\`
EN: “Rupa and Maya (11) are best friends...”
KO: “11살 루파와 마야는 … 가장 친한 친구다.”
\`\`\`

**규칙 4** 한국 인물(캐릭터명) + 배우 실명: 한글 캐릭터명(배우 실명) 병기
이 규칙은 **한국 배역명 + 외국 배우 실명** 패턴에만 적용한다. 서양 인명 음역에 적용하지 않는다(→ notation-rules.md 이름 표기).
\`\`\`
EN: “Namsang (Dayahang Rai) and his wife Hangma (Miruna Magar)”
KO: “남상(다야항 라이)과 그의 아내 항마(미루나 마가르)”
\`\`\`

**규칙 4-1** 영어 콜론(\`:\`) 구조 → 한국어 두 문장 분리
콜론이 긴 동격·설명절을 이끄는 경우, 콜론 앞을 첫 문장으로 끊고 콜론 이하를 별도 문장으로 처리한다. 수식절을 겹쳐 쌓지 않는다.
\`\`\`
EN: he sets his sights on his most ambitious challenge yet: a fast, oxygen-free climb of K2
✓ 올바름: 지금껏 가장 야심 찬 도전에 나선다. K2를 무산소로, 빠르게 오르는 것이다.
✗ 잘못:   K2를 산소 없이 빠르게 오르는, 가장 야심 찬 도전에 나서는 여정을 따라간다.
          (수식절 이중 적층)
\`\`\`
등산 전문 용어(무산소·베이스캠프 등) → notation-rules.md 등산·산악 전문 용어 참조.

## 2. 한→영

### 한→영 공통 원칙

**원문 충실도 우선**
원문에 없는 이미지·수식어·극적 어휘를 추가하지 않는다. 원문이 담백하면 번역도 담백하게. 문학적 윤색은 원문이 이미 그런 경우에만 따라간다.
\`\`\`
✗ 경계       → “razor’s edge”    ✓ → boundary / edge
✗ 잊힌       → “erased”          ✓ → forgotten
✗ 폴란드인들의 대자유 → “a great freedom uniquely their own”  ✓ → their great freedom
\`\`\`

**어휘 등급(register)**
프로그램북 독자에게 맞는 자연스럽고 명확한 어휘를 선택한다. 라틴어 차용어 및 과도하게 격식적인 표현을 지양한다.

| 원문 | ✗ 피할 표현 | 이유 | ✓ 권장 |
|---|---|---|---|
| 역저(力著) / 역작 | magnum opus | 라틴어 차용어, 격식 과잉 | monumental work / significant work |
| 기록자 | chronicler | 역사 편찬가(편년사가) 뉘앙스 | record-keeper |
| 끈질긴 | tireless | ‘지칠 줄 모르는’으로 의미 어긋남 | persistent / relentless |
| 사료 | historical records | 너무 포괄적 | archival sources / archival research |

**숫자 표기**
본문 내 숫자는 문자로 풀어 쓴다. 연도·정밀 수치는 예외.
\`\`\`
✗ 60여 년   → ✓ more than sixty years
✗ 2백만     → ✓ two million
예외: 1947년 → 1947 / 8,000m → 8,000 m / 97편 목록 등 정밀 수치
\`\`\`

### 2-1. 시놉시스

**규칙 12** 시간·장소 맥락 → 문두 부사구로 명시
\`\`\`
KO: “6.25 전쟁으로 부모를 잃은 수지와 오목은...”
EN: “During the Korean War, Su-ji and Oh-mok lose their parents...”
\`\`\`

**규칙 13** 시간 전환 → 전환사 명시 (\`Years later\`, \`Meanwhile\`, \`Eventually\`, \`After\`, \`Only then\`)
\`\`\`
KO: “세월이 흐른 뒤 상류층이 된 수지는...”   → EN: “Years later, having risen to the upper class, she...”
KO: “수지는 비로소 진실을 깨닫는다.”         → EN: “Only then does Su-ji finally come to terms with the truth.”
\`\`\`

**규칙 14** 한국어 관형절 → 영어 관계절(\`who/which/that\`) 또는 분사구문
\`\`\`
KO: “고아원 출신 일환과 결혼한 오목은...”
EN: “Oh-mok, who marries Il-hwan, an orphan, ...”
\`\`\`

**규칙 15** 한국어 현재형 → 영어 현재 시제(historical present) 유지
\`\`\`
KO: “봉수는 가난한 농부로 딸의 혼례도 미룬 채 살아간다.”
EN: “Bong-su is a poor farmer who keeps putting off his daughter’s wedding.”
\`\`\`

**규칙 16** 한국 고유 표현
- 음차 유지: \`막걸리 → makgeolli\`, \`달밧 → dal bhat\`
- 풀어서 설명: \`6.25 전쟁 → the Korean War\`, \`외가 → maternal relatives\`, \`성인식 → a coming-of-age ritual\`

### 2-2. 프로그램 노트

**규칙 17** 3인칭 노트 → 원문 주어에 맞는 표현으로 시작
- 주어가 **영화**인 경우: \`“This film...”\` / \`“The film...”\`
- 주어가 **도서·전시 패널** 등 비영화 텍스트인 경우: 제목 이탤릭으로 시작. **“This film” / “This book” 모두 금지. 문장 구조를 바꾸더라도 제목 유지.**
\`\`\`
KO: “<걸 클라이머>는 에밀리 해링턴의 24시간 엘 캐피탄 등반을 따라가는 작품이다.”
EN: “*Girl Climber* follows Emily Harrington’s bold 24-hour ascent of El Capitan...”

KO: “『WINTER 8000』은 … 책으로 …”
EN: “*WINTER 8000* explores …”           ✓
EN: “This film explores …”               ✗  (도서를 film으로)
EN: “This book covers …”                 ✗  (제목 → This book 대체 금지)
\`\`\`

**규칙 18** 1인칭 노트 → \`나/우리 → I/we\` 유지, 생략 주어도 명시. **필자의 1인칭 회상·논평도 동일 인칭 유지.**
\`\`\`
KO: “이런 부정적인 생각의 굴레에서 벗어나기 위해 다큐를 찍기 시작했다.”
EN: “I started filming this documentary to escape the cycle of negative thoughts.”

KO: “한국의 산악계를 떠올리지 않을 수 없었다.”  (필자 1인칭 회상)
EN: “I could not help but think of Korea’s own mountaineering world.”  ✓
EN: “one cannot help but think of...”  ✗  (비인칭 변환 금지)
\`\`\`

**규칙 19** 한국어 긴 복문 → 영어 2~3문장으로 분리
\`\`\`
KO: “핀란드 라플란드의 … 이들의 이야기를 감동적이고 인간적으로 담아냈다. 정말 아이러니한 것은…”
EN: “This film documents… It is a touching and humane portrait… The great irony is that…”
\`\`\`

### 2-3. 바이오

**규칙 20** 이름을 주어로 시작 (영→한 규칙 9와 반대)
\`\`\`
KO: “1982년 <꼬방동네 사람들>로 데뷔해...”
EN: “Bae Chang-ho made his directorial debut with *People in the Slum* in 1982...”
\`\`\`

**규칙 21** 한국어 완료 사실 → 영어 현재완료 (\`“has won”\`, \`“has appeared”\`)
\`\`\`
KO: “데뷔작 <그리고 저녁이 온다>는 … 50여 개의 상을 받았다.”
EN: “Her debut, *Then Comes the Evening*, won at Full Frame, earning OSCAR® qualification and 50+ awards.”

**규칙 22** 한국 영화 제목 → 꺾쇠 없이 영문 번역 제목(이탤릭) 〔v2 수정〕
> 공식 영문 제목 있으면 그것을, 없으면 직역.
\`\`\`
<꼬방동네 사람들> → *People in the Slum*
<고래사냥>        → *Whale Hunting*

### 2-4. 섹션 서문

**규칙 23** 섹션명 → 영문 큰따옴표
\`\`\`
KO: ‘자연’ 섹션에서는 …  →  EN: The “Nature” section presents …
\`\`\`
도입 동사: \`presents\` / \`features\` / \`is composed of\`

**규칙 24** 성격 비슷한 작품 → 주제별 단락, 세미콜론·연결사(\`while\`, \`also\`, \`in addition\`) 허용

**규칙 25** 귀속 표시: \`― 프로그래머 이름 → ― Jinna Lee, Programmer\` / \`― 트렌토영화제 로잔나 스테딜레 → ― Rosanna Stedile, Trento Film Festival\`

**규칙 26** \`*\` 각주 포함 전문 번역. 기관명·영화제명은 글로서리 확정 표기 사용.

**규칙 27** 길이 제한 없음. 작품명·감독명·정보 누락 불가.

### 2-5. 페스티벌 프로그램

> **직역 원칙 적용** — 이 섹션은 일정·안내·행사 정보 전달이 목적이므로 규칙 0-6의 의역 허용 범위가 적용되지 않는다. 내용·수치·일정을 있는 그대로 옮긴다.

### 2-6. 도서·전시 패널

도서 소개 패널, 기관·단체 소개 패널, 사진·작품 설명 패널 등 전시 성격의 텍스트.

**규칙 32** 도서명 이탤릭으로 시작. “This book” / “This film” 대체 금지 (→ 규칙 17과 동일 원칙).
\`\`\`
KO: 『Alpine Rising』은 한 세기 동안 … 이름들을 불러내는 책이다.
EN: *Alpine Rising* summons the names …   ✓
EN: This book summons the names …         ✗  (제목 → This book 대체 금지)
\`\`\`

**규칙 32-1** 원문에 도서명 주어 없으면 추론 추가 금지
원문 문단이 도서명 없이 서술만 있는 경우(“~을 다룬 책이다” 등), 문맥으로 어느 책인지 유추되더라도 도서명을 주어로 삽입하지 않는다. 원문 구조 그대로 옮긴다.
\`\`\`
KO: “히말라야 등반 기록의 권위자로 알려진 엘리자베스 홀리의 삶을 다룬 책이다.”
✓ EN: “A book covering the life of Elizabeth Hawley, widely recognized as the foremost authority on Himalayan climbing records.”
✗ EN: “Keeper of the Mountains traces the life of Elizabeth Hawley…”  (도서명 추론 삽입 금지)
\`\`\`

**규칙 33** 필자 1인칭(큐레이터·프로그래머 목소리) 유지 (→ 규칙 18과 동일 원칙, 예시도 동일).

**규칙 34** 역사 사실·창립연도·인명·기관명 정확히 보존. 글로서리 확정 표기 우선.
\`\`\`
KO: 1945년 조국 광복과 더불어 … 두 번째로 설립된 사회단체
EN: the second social organization founded after Korea’s liberation in 1945   ✓
\`\`\`

**규칙 35** 길이 제한 없음. 제목·저자·연도·기관명 누락 불가.

## 4. 소스 텍스트 정규화 (번역 전 확인)

괄호·따옴표·제목 표기는 \`notation-rules.md\` 기준을 따른다. 핵심만 요약:
- 도서 \`『 』\` / 영화 \`< >\` / 전시 \`《 》\` / 강조·비유 \`‘ ’\` / 직접 인용 \`“ ”\`
- 소스에서 도서를 \`《 》\`·\`〈 〉\`로 쓴 경우 번역 시 \`『 』\`로 정규화.
- 영문 도서명은 항상 이탤릭.

## 5. 고유명사 표기

인명·지명·산악 전문 용어 표기 규칙은 \`notation-rules.md\` 이름 표기 / 등산·산악 전문 용어 섹션 참조.`;

const EMBEDDED_NOTATION = `# 표기 규칙 (Notation Rules)

## 영화 제목 표기
- 영화 제목은 꺾쇠 \`< >\`를 사용하고, 영문 제목은 이탤릭체로 쓴다. (예: <화양연화> / *In the Mood for Love*)
- 국영문 병기 시에는 꺾쇠만 사용한다. (예: <영원과 하루 Eternity and a Day>)
- 저작권자의 별도 제목표기 요청이 있을 경우 요청에 따라 표기한다.
- 제목·제작연도·감독을 함께 표기할 경우:
  - <화양연화>(왕가위, 2000) / In the Mood for Love(Wang Karwai, 2000)
  - <영원과 하루 Eternity and a Day>(테오 앙겔로풀로스 Theo Angelopoulos, 1998)
  - Eternity and a Day(Theo Angelopoulos 1998), In the Mood for Love(Wang Karwai, 2000)

## 작품 정보 표기
- 표기 순서: 제작국가, 제작연도, 러닝타임, 색채, 카테고리, 관람 등급. (책자의 경우 해당, 홈페이지는 자동)
- 예: \`Korea | 2015 | 114min | Color | Documentary | G\`

## 기타 영화 관련
- 제작연도는 마지막 최종 작업(제작)이 완료된 시점만 표기한다. (2002-2003 → X, 2003 → O)
- 러닝타임은 분·초 단위 모두 올림하여 분 단위로만 표기한다. 숫자 바로 뒤에 \`min\`, 마침표 없음. (예: 53min)
- 색채 표기: 컬러는 \`Color\`, 흑백은 \`B&W\`.
- 프리미어 표기: World Premiere / International Premiere / Asian Premiere / Korean Premiere 중 해당 사항 표기.

## 서적 표기
- 도서 제목은 겹낫표 『 』, 영문은 이탤릭, 저자명은 ( ) 안에 표기한다.
- 예: 『도전』 (크리스 보닝턴) / *Cahier du Cinema* (Chris Bonington)

## 기타 표기 (논문·정기간행물·TV·전시·음반·공연 등)
- 논문·정기간행물·TV 프로그램의 국문 제목은 낫표 「 」, 영문은 이탤릭, 저자명은 ( ).
- 전시는 《 》 사용, 국영문 동일. (예: 《모니카와 떠나는 세계명화 여행전》)
- 음반의 한글·영문 표기는 낫표 「 」 안에, 노래 제목은 작은따옴표 ‘ ’. (예: 「애비 로드」에 수록된 ‘Come Together’)
- **[한→영 번역 시]** 음반명은 「 」, 노래·곡 제목은 ‘ ’. 노래·곡 제목은 원문 언어 그대로 유지하고 번역하지 않는다. 큰따옴표 “ ” 사용 금지.
  - 예: 미니앨범 「The First Lumos」/ 싱글 ‘너에게로, 이별’, ‘For Sentimental Reasons’, ‘실연’
  - ✗ 잘못: “Heartbreak” (실연 번역 금지) / “For Sentimental Reasons” (큰따옴표 금지)

## 이름 표기

### 외국 인명 한글 표기 (영→한)
- **글로서리 등재 인명**: 학습 데이터 표기와 달라도 글로서리 표기를 절대 우선한다.
  - 예) 보이테크 쿠르티카 → Wojciech Kurtyka (Voytek 등 비공식 표기 사용 금지)
- **글로서리 미등재 인명: 원문 그대로 유지. 음역하지 않는다.**
  - 예) Benjamin Védrines → Benjamin Védrines (✗ 벤자맹 베드린으로 음역 금지)
- 글로서리 등재 인명 음역 기준: 원어 발음 기준, 현행 외래어 표기법 준수. 국내 관례 표기 우선.
  - 예) Wanda Rutkiewicz → 반다 루트키에비츠 / Reinhold Messner → 라인홀트 메스너

### 한국 인명 영문 로마자 (한→영)
- \`성 + 공백 + 이름\`, 이름 음절 사이 하이픈. 본인 영문명 있으면 우선.
  - 예) 이정진 → Jinna Lee / 배창호 → Bae Chang-ho / 엄홍길 → Um Hong-gil

//  USD→KRW 환율 (실시간 조회 + 방어적 폴백)
// ═══════════════════════════════════════════════
const FX_FALLBACK_RATE = 1450; // API 조회 실패 시에만 사용하는 최후 폴백값
const FX_SANITY_MIN    = 800;  // 이 범위를 벗어난 응답은 오류로 간주하고 무시
const FX_SANITY_MAX    = 3000;
const FX_CACHE_KEY      = 'umff_usd_krw_rate';
const FX_CACHE_TTL_MS   = 12 * 60 * 60 * 1000; // 12시간 — 이 안에는 재조회하지 않음

let usdKrwRate    = FX_FALLBACK_RATE;
let usdKrwFetched = null; // 실시간 값이 반영된 시각(Date) — null이면 폴백값 사용 중

function isValidRate(n) {
  return typeof n === 'number' && isFinite(n) && n > FX_SANITY_MIN && n < FX_SANITY_MAX;
}

function loadCachedRate() {
  try {
    const cached = JSON.parse(localStorage.getItem(FX_CACHE_KEY) || 'null');
    if (cached && isValidRate(cached.rate) && typeof cached.fetchedAt === 'number') {
      usdKrwRate    = cached.rate;
      usdKrwFetched = new Date(cached.fetchedAt);
      return cached;
    }
  } catch {}
  return null;
}

async function refreshExchangeRate() {
  const cached = loadCachedRate();
  if (cached && (Date.now() - cached.fetchedAt) < FX_CACHE_TTL_MS) return; // 캐시가 아직 최신

  try {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 4000);
    const res = await fetch('https://open.er-api.com/v6/latest/USD', { signal: ctrl.signal });
    clearTimeout(timer);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    const rate = data?.rates?.KRW;
    if (!isValidRate(rate)) throw new Error('비정상 환율 응답');

    usdKrwRate    = rate;
    usdKrwFetched = new Date();
    localStorage.setItem(FX_CACHE_KEY, JSON.stringify({ rate, fetchedAt: usdKrwFetched.getTime() }));
  } catch (e) {
    // 네트워크 실패·비정상 값 — 캐시값(있다면) 또는 폴백값을 조용히 유지. 번역 기능에는 영향 없음.
    console.warn('환율 갱신 실패 — 기존 값 유지:', e);
  }
}

// 정적 블록: 글로서리·가이드·예시·출력형식 — cache_control 적용 대상
// D-1: proper-nouns CSV → 카테고리별 JSON 최소화
// RFC4180 방식으로 한 줄을 필드 배열로 분리 (따옴표로 감싼 필드 안의 콤마·이스케이프된 "" 처리)
function parseCsvLine(line) {
  const result = [];
  let cur = '';
  let inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (inQuotes) {
      if (ch === '"') {
        if (line[i + 1] === '"') { cur += '"'; i++; }
        else { inQuotes = false; }
      } else {
        cur += ch;
      }
    } else if (ch === '"') {
      inQuotes = true;
    } else if (ch === ',') {
      result.push(cur);
      cur = '';
    } else {
      cur += ch;
    }
  }
  result.push(cur);
  return result;
}

function csvToCompactJson(csvText) {
  const SKIP_CATS = new Set(['전화번호', '주소', '가격']);
  const lines = csvText.trim().split('\n').slice(1);
  const result = {};
  for (const line of lines) {
    if (!line.trim()) continue;
    const [category, ko, en] = parseCsvLine(line);
    if (!category || !ko || !en) continue;
    const cat = category.trim(), k = ko.trim(), e = en.trim();
    if (SKIP_CATS.has(cat)) continue;
    if (!result[cat]) result[cat] = {};
    result[cat][k] = e;
  }
  return JSON.stringify(result, null, 0);
}

// ═══════════════════════════════════════════════
//  API Key
// ═══════════════════════════════════════════════
function toggleKeyBar() {
  const bar = document.getElementById('keyBar');
  bar.classList.toggle('open');
  if (bar.classList.contains('open')) {
    document.getElementById('keyInput').value = localStorage.getItem('umff_api_key') || '';
    refreshKeyStatus();
  }
}

function saveKey() {
  const val = document.getElementById('keyInput').value.trim();
  if (!val) { alert('API Key를 입력하세요.'); return; }
  localStorage.setItem('umff_api_key', val);
  refreshKeyStatus();
  document.getElementById('keyBar').classList.remove('open');
}

function refreshKeyStatus() {
  const key = localStorage.getItem('umff_api_key') || '';
  const el = document.getElementById('key-status');
  if (key) {
    el.textContent = `저장됨: ${key.slice(0, 10)}…`;
    el.style.color = '#1a5040';
  } else {
    el.textContent = '미설정';
    el.style.color = '#999';
  }
}

//  UI helpers

function onInput() {
  const len = document.getElementById('inputText').value.length;
  document.getElementById('charCount').textContent = `${len.toLocaleString()}자`;
}

function switchTab(idx) {
  document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', i === idx));
  document.querySelectorAll('.panel').forEach((p, i) => p.classList.toggle('active', i === idx));
}

function setLoading(on) {
  document.getElementById('loading').classList.toggle('show', on);
  document.getElementById('runBtn').disabled = on;
}

function showError(msg) {
  const el = document.getElementById('errorBox');
  el.textContent = `오류: ${msg}`;
  el.classList.add('show');
}

function clearError() {
  document.getElementById('errorBox').classList.remove('show');
}

function showStream(text) {
  const el = document.getElementById('streamBox');
  el.textContent = text;
  el.classList.add('show');
  el.scrollTop = el.scrollHeight;
}

function hideStream() {
  const el = document.getElementById('streamBox');
  el.classList.remove('show');
  el.textContent = '';
}

// ═══════════════════════════════════════════════
//  Response parser
// ═══════════════════════════════════════════════
function parseResponse(raw) {
  // 마크다운 기호(**[SECTION:...]**) 제거
  const normalized = raw.replace(/\*+(\[(?:\/?)\s*SECTION[^\]]*\])\*+/gi, '$1');

  const get = (key) => {
    // 1차: 공백·대소문자 허용한 정규식
    const re = new RegExp(`\\[SECTION\\s*:\\s*${key}\\s*\\]([\\s\\S]*?)\\[\\s*/SECTION\\s*\\]`, 'i');
    const m = normalized.match(re);
    if (m) return m[1].trim();

    // 2차: [/SECTION] 없이 잘린 경우 — 다음 [SECTION: 또는 끝까지 캡처
    const re2 = new RegExp(`\\[SECTION\\s*:\\s*${key}\\s*\\]([\\s\\S]*?)(?=\\[SECTION\\s*:|$)`, 'i');
    const m2 = normalized.match(re2);
    return m2 ? m2[1].trim() : '';
  };

  return {
    translation : get('번역문'),
    length      : get('길이'),
  };
}

function renderMarkdown(text) {
  return text
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>');
}

// ═══════════════════════════════════════════════
//  Main: run translation
// ═══════════════════════════════════════════════
async function runTranslation() {
  clearError();
  document.getElementById('tokenBar').classList.remove('show');

  const text = document.getElementById('inputText').value.trim();
  if (!text) { showError('번역할 텍스트를 입력하세요.'); return; }

  const apiKey = localStorage.getItem('umff_api_key');
  if (!apiKey) {
    showError('API Key가 설정되지 않았습니다. 우측 상단 ⚙ API Key 버튼을 눌러 입력하세요.');
    toggleKeyBar();
    return;
  }

  // 결과 영역을 미리 열고 번역문 탭으로 전환 — 스트림 중에도 내용이 실시간으로 표시됨
  document.getElementById('content0').textContent = '';
  document.getElementById('content1').textContent = '';
  document.getElementById('results').classList.add('show');
  switchTab(0);

  const dirLabel  = selectedDirection === 'ko-en' ? '한→영' : '영→한';
  const typeLabel = TYPE_LABELS[selectedType];
  const userMsg   = `다음 텍스트를 번역해 주세요.\n번역 방향: ${dirLabel} / 유형: ${typeLabel}\n\n${text}`;

  setLoading(true);

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-beta': 'prompt-caching-2024-07-31',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: MODEL_CONFIG[selectedModel].id,
        max_tokens: 8000,
        stream: true,
        system: [
          { type: 'text', text: buildStaticPrompt(),  cache_control: { type: 'ephemeral', ttl: '1h' } },
          { type: 'text', text: buildDynamicPrompt() }
        ],
        messages: [{ role: 'user', content: userMsg }]
      })
    });

    if (!response.ok) {
      let msg = `HTTP ${response.status}`;
      try { const e = await response.json(); msg = e.error?.message || msg; } catch {}
      throw new Error(msg);
    }

    const reader  = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let fullText = '';
    let inputUsage = null;
    let usageData  = null;

    document.getElementById('loading').querySelector('.loading-msg').textContent = '번역 진행 중… (실시간 출력)';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const data = line.slice(6).trim();
        if (data === '[DONE]') continue;
        try {
          const evt = JSON.parse(data);
          if (evt.type === 'message_start' && evt.message?.usage) {
            inputUsage = evt.message.usage;
          }
          if (evt.type === 'content_block_delta' && evt.delta?.type === 'text_delta') {
            fullText += evt.delta.text;
            // [SECTION:번역문] 이후 텍스트만 실시간으로 탭에 표시
            const m = fullText.match(/\[SECTION\s*:\s*번역문\s*\]([\s\S]*)/i);
            if (m) {
              document.getElementById('content0').innerHTML =
                renderMarkdown(m[1].replace(/\[\/SECTION\][\s\S]*/i, '').trim() || '…');
            }
          }
          if (evt.type === 'message_delta' && evt.usage) {
            usageData = evt.usage;
          }
        } catch {}
      }
    }

    setLoading(false);

    // Token counter
    if (usageData || inputUsage) {
      const inTok      = inputUsage?.input_tokens                || 0;
      const cacheWrite = inputUsage?.cache_creation_input_tokens || 0;
      const cacheRead  = inputUsage?.cache_read_input_tokens     || 0;
      const outTok     = usageData?.output_tokens                || 0;
      const p = MODEL_CONFIG[selectedModel];
      const costUSD = (inTok * p.input + cacheWrite * p.cacheWrite + cacheRead * p.cacheRead + outTok * p.output) / 1_000_000;
      const costKRW = Math.round(costUSD * usdKrwRate);
      const cacheHit = cacheRead > 0;
      const fxNote = usdKrwFetched ? '' : ' · 환율 미조회(기본값)';
      document.getElementById('tokIn').textContent         = inTok.toLocaleString();
      document.getElementById('tokCacheWrite').textContent = cacheWrite > 0 ? cacheWrite.toLocaleString() : '—';
      document.getElementById('tokCacheRead').textContent  = cacheRead  > 0 ? `${cacheRead.toLocaleString()} ✓` : '—';
      document.getElementById('tokOut').textContent        = outTok.toLocaleString();
      document.getElementById('tokCost').textContent       = `${p.label} · 약 $${costUSD.toFixed(4)} (약 ₩${costKRW.toLocaleString()})${cacheHit ? ' 🔁캐시' : ''}${fxNote}`;
      document.getElementById('tokenBar').classList.add('show');
    }

    const parsed = parseResponse(fullText);

    if (!parsed.translation && fullText) {
      showError('출력 형식 오류 — 번역문 탭에 전체 응답을 표시합니다. 수동으로 복사하세요.');
      document.getElementById('content0').textContent = fullText;
    } else {
      document.getElementById('content0').innerHTML = renderMarkdown(parsed.translation || '(번역문 없음)');
    }
    document.getElementById('content1').textContent = parsed.length || '(내용 없음)';

  } catch (err) {
    setLoading(false);
    document.getElementById('results').classList.remove('show');
    showError(err.message);
  }
}

// ═══════════════════════════════════════════════
//  Copy button
// ═══════════════════════════════════════════════
function copyContent(panelIdx) {
  const el = document.getElementById(`content${panelIdx}`);
  const btnId = `copyBtn${panelIdx}`;

  const done = () => {
    const btn = document.getElementById(btnId);
    btn.textContent = '복사됨!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '번역문 복사'; btn.classList.remove('copied'); }, 2000);
  };
  const fail = () => {
    const btn = document.getElementById(btnId);
    btn.textContent = '복사 실패';
    setTimeout(() => { btn.textContent = '번역문 복사'; }, 2000);
  };

  // <em> → inline style: Google Sheets는 시맨틱 태그보다 인라인 스타일을 더 안정적으로 인식
  const richHtml = el.innerHTML
    .replace(/<em>/g, '<span style="font-style:italic">')
    .replace(/<\/em>/g, '</span>')
    .replace(/<strong>/g, '<span style="font-weight:bold">')
    .replace(/<\/strong>/g, '</span>')
    .replace(/\n/g, '<br>');
  const plain = el.textContent;

  // 1순위: contenteditable 임시 요소 + execCommand
  // 일반 div와 달리 contenteditable에서 복사하면 브라우저가 HTML 포맷을 클립보드에 올림
  const tmp = document.createElement('div');
  tmp.contentEditable = 'true';
  tmp.style.cssText = 'position:fixed;top:-9999px;left:-9999px;white-space:pre-wrap';
  tmp.innerHTML = richHtml;
  document.body.appendChild(tmp);
  try {
    const range = document.createRange();
    range.selectNodeContents(tmp);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    const ok = document.execCommand('copy');
    sel.removeAllRanges();
    document.body.removeChild(tmp);
    if (ok) { done(); return; }
  } catch (e) {
    document.body.removeChild(tmp);
  }

  // 2순위: ClipboardItem API (HTTPS 필요)
  const html = `<html><body>${richHtml}</body></html>`;
  if (navigator.clipboard.write) {
    navigator.clipboard.write([new ClipboardItem({
      'text/html': new Blob([html], { type: 'text/html' }),
      'text/plain': new Blob([plain], { type: 'text/plain' }),
    })]).then(done).catch(() => navigator.clipboard.writeText(plain).then(done).catch(fail));
  } else {
    navigator.clipboard.writeText(plain).then(done).catch(fail);
  }
}
